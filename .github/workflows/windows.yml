name: Windows checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.paths.outputs.matrix }}
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select changed applications
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              directories = ['.', 'reference']
          else:
              base = os.environ['BASE_SHA']
              head = os.environ['HEAD_SHA']
              if base == '0' * 40:
                  command = ['git', 'ls-tree', '-r', '--name-only', '-z', head]
              elif os.environ['EVENT_NAME'] == 'pull_request':
                  command = ['git', 'diff', '--name-only', '--no-renames', '-z', f'{base}...{head}']
              else:
                  command = ['git', 'diff', '--name-only', '--no-renames', '-z', base, head]
              paths = subprocess.check_output(command).decode('utf-8').split('\0')
              paths = [path for path in paths if path]
              shared_paths = {
                  '.github/workflows/windows.yml',
                  'scripts/doc_check.py',
                  'docs/document-policy.md',
                  'docs/standards/mock-driven-development.md',
                  'LICENSE',
              }
              shared = any(path in shared_paths for path in paths)
              directories = []
              if shared or any(not path.startswith('reference/') for path in paths):
                  directories.append('.')
              if shared or any(path.startswith('reference/') for path in paths):
                  directories.append('reference')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'matrix={json.dumps({"directory": directories})}\n')
              output.write(f'changed={str(bool(directories)).lower()}\n')
          print(f'Selected applications: {directories}')
          PY
  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    env:
      CI: 'true'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - name: Read tool versions
        id: tools
        run: |
          @'
          import os
          import re
          import tomllib
          from pathlib import Path

          tools = tomllib.loads(Path('mise.toml').read_text(encoding='utf-8'))['tools']
          wails = re.search(r'github.com/wailsapp/wails/v3 (\S+)', Path('go.mod').read_text(encoding='utf-8')).group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"go={tools['go']}\npython={tools['python']}\nwails={wails}\nimage={os.environ['ImageOS']}\n")
          '@ | python -
      - uses: actions/setup-node@v6
        with:
          node-version-file: ${{ matrix.directory }}/.nvmrc
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.tools.outputs.python }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.tools.outputs.go }}
          cache: false
      - name: Restore Wails CLI
        id: wails-cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.directory }}/.tools/wails3.exe
          key: wails-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.image }}-${{ steps.tools.outputs.go }}-${{ steps.tools.outputs.wails }}-${{ matrix.directory }}
      - name: Install Wails CLI
        if: steps.wails-cache.outputs.cache-hit != 'true'
        run: node scripts/run.mjs cli:install
      - name: Go cache paths
        id: go-cache
        run: |
          "modules=$(go env GOMODCACHE)" >> $env:GITHUB_OUTPUT
          "build=$(go env GOCACHE)" >> $env:GITHUB_OUTPUT
      - name: Restore Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: go-app-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.image }}-${{ steps.tools.outputs.go }}-${{ matrix.directory }}-${{ hashFiles(format('{0}/go.sum', matrix.directory)) }}
          restore-keys: |
            go-app-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.image }}-${{ steps.tools.outputs.go }}-${{ matrix.directory }}-
      - name: Dependencies
        run: node scripts/run.mjs setup:dependencies
      - name: Browser
        working-directory: ${{ matrix.directory }}/frontend
        run: npx playwright install --only-shell chromium
      - name: Verify and build
        run: node scripts/run.mjs ci
      - name: NSIS
        run: choco install nsis --yes --no-progress
      - name: Installer
        run: node scripts/run.mjs package:prepared
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ matrix.directory == '.' && 'project' || 'reference' }}
          path: ${{ matrix.directory }}/bin/*-setup.exe
      - name: Upload failed-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-${{ matrix.directory == '.' && 'project' || 'reference' }}
          path: |
            ${{ matrix.directory }}/frontend/playwright-report/
            ${{ matrix.directory }}/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
