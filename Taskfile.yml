version: '3'

vars:
  # 生成先の reference/ は親ディレクトリの共通検査器を使う。
  DOC_CHECK: '{{if eq (osBase .ROOT_DIR) "reference"}}../{{end}}scripts/doc_check.py'

tasks:
  generate:
    run: once
    cmds:
      - wails3 generate bindings -ts -i -names -f '-tags=server' -d frontend/bindings .
      - npm --prefix frontend run routes
  frontend:build:
    run: once
    cmds:
      - task: generate
      - npm --prefix frontend run build:prepared
  frontend:dev:
    dir: frontend
    cmds: [npm run dev]
  build:dev:
    cmds:
      - task: generate
      - npm --prefix frontend run build:dev
      - node scripts/build.mjs desktop-dev
  run:
    cmds: [node scripts/build.mjs run]
  build:
    cmds:
      - task: frontend:build
      - node scripts/build.mjs desktop
  build:server:
    cmds:
      - task: frontend:build
      - node scripts/build.mjs server
  build:server:e2e:
    cmds:
      - task: frontend:build
      - node scripts/build.mjs server-e2e
  # Screen review with the e2e build (fixed sign-in, file store); not a production path.
  server:review:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review
  server:review:login:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-login
  server:review:login-multiple:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-login-multiple
  server:review:foundry-change:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-foundry-change
  server:review:foundry-refresh:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-foundry-refresh
  server:review:foundry-add:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-foundry-add
  server:review:foundry-delete:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-foundry-delete
  server:review:deployment-refresh:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-deployment-refresh
  server:review:deployment-detail:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-deployment-detail
  server:review:deployment-delete:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-deployment-delete
  server:review:deployment-add:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-deployment-add
  server:review:deployment-update:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-deployment-update
  server:review:update:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-update
  server:review:update-untrusted:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-update-untrusted
  server:review:tenant-revisit:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-tenant-revisit
  server:review:foundry-empty:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-foundry-empty
  server:review:no-foundry:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-no-foundry
  server:review:tenant-change:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-tenant-change
  server:
    cmds:
      - task: build:server
      - node scripts/build.mjs run-server
  package:
    cmds:
      - task: build
      - task: package:prepared
  package:prepared:
    cmds:
      - node scripts/build.mjs package
  ci:
    cmds:
      - task: verify
      - npm --prefix frontend exec -- playwright install --only-shell chromium
      - task: build:server:e2e
      - task: ci:finish
  ci:finish:
    deps: [test:e2e, build]
  test:core:
    cmds: [go test ./internal/...]
  lint:
    deps: [lint:frontend, lint:scripts, check:workflow]
  lint:frontend:
    cmds: [npm --prefix frontend run lint]
  lint:scripts:
    cmds: [npm --prefix frontend run lint:scripts]
  check:workflow:
    cmds: [node scripts/run.mjs check:workflow]
  lint:go:
    cmds:
      - task: frontend:build
      - task: lint:go:prepared
  lint:go:prepared:
    cmds: [node scripts/run.mjs lint:go:prepared]
  format:
    cmds:
      - node scripts/run.mjs format:go
      - npm --prefix frontend run format
  format:check:
    cmds:
      - node scripts/run.mjs format:go:check
      - npm --prefix frontend run format:check
  test:frontend:
    cmds: [npm --prefix frontend run test]
  check:docs:
    cmds:
      - python {{.DOC_CHECK}} .
  test:e2e:
    cmds: [npm --prefix frontend run test:e2e]
  verify:
    cmds:
      - task: generate
      - task: verify:prepared
  verify:prepared:
    deps: [frontend:build, lint, format:check, test:frontend, test:core, check:docs]
    cmds:
      - task: verify:go:prepared
  # Go checks only read assets after frontend:build has finished.
  verify:go:prepared:
    deps: [vet:go:prepared, lint:go:prepared]
  vet:go:prepared:
    cmds:
      - go vet -tags production . ./internal/... ./cmd/...
      - go vet -tags server,production,e2e . ./internal/... ./cmd/...
  verify:e2e:
    cmds:
      - task: verify
      - task: build:server:e2e
      - task: test:e2e
