version: '3'

vars:
  # 生成先の reference/ は親ディレクトリの共通検査器を使う。
  DOC_CHECK: '{{if eq (osBase .ROOT_DIR) "reference"}}../{{end}}scripts/doc_check.py'

tasks:
  generate:
    run: once
    cmds:
      - wails3 generate bindings -ts -i -names -f '-tags=server' -d frontend/bindings .
      - npm --prefix frontend run routes
  frontend:build:
    run: once
    cmds:
      - task: generate
      - npm --prefix frontend run build:prepared
  frontend:dev:
    dir: frontend
    cmds: [npm run dev]
  build:dev:
    cmds:
      - task: generate
      - npm --prefix frontend run build:dev
      - node scripts/build.mjs desktop-dev
  run:
    cmds: [node scripts/build.mjs run]
  build:
    cmds:
      - task: frontend:build
      - node scripts/build.mjs desktop
  build:server:
    cmds:
      - task: frontend:build
      - node scripts/build.mjs server
  build:server:e2e:
    cmds:
      - task: frontend:build
      - node scripts/build.mjs server-e2e
  # Screen review with the e2e build (fixed sign-in, file store); not a production path.
  server:review:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review
  server:review:login:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-login
  server:review:login-multiple:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-login-multiple
  server:review:foundry-change:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-foundry-change
  server:review:foundry-refresh:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-foundry-refresh
  server:review:deployment-refresh:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-deployment-refresh
  server:review:foundry-revisit:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-foundry-revisit
  server:review:tenant-revisit:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-tenant-revisit
  server:review:foundry-empty:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-foundry-empty
  server:review:no-foundry:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-no-foundry
  server:review:tenant-change:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review-tenant-change
  server:
    cmds:
      - task: build:server
      - node scripts/build.mjs run-server
  package:
    cmds:
      - task: build
      - task: package:prepared
  package:prepared:
    cmds:
      - node scripts/build.mjs package
  ci:
    cmds:
      - task: verify:prepare
      - task: ci:finish
  ci:finish:
    deps: [test:e2e, build]
  test:core:
    cmds: [go test ./internal/...]
  lint:
    cmds: [npm --prefix frontend run lint]
  format:check:
    cmds: [npm --prefix frontend run format:check]
  test:frontend:
    cmds: [npm --prefix frontend run test]
  check:docs:
    cmds:
      - python {{.DOC_CHECK}} .
  test:e2e:
    cmds: [npm --prefix frontend run test:e2e]
  verify:prepare:
    cmds:
      - task: generate
      - task: verify:prepared
  verify:prepared:
    deps: [frontend:build, lint, format:check, test:frontend, test:core, check:docs]
    cmds:
      - go vet -tags production ./...
      - go vet -tags server,production,e2e ./...
      - task: build:server:e2e
  verify:
    cmds:
      - task: verify:prepare
      - task: test:e2e
