version: '3'

vars:
  # 生成先の reference/ は親ディレクトリの共通検査器を使う。
  DOC_CHECK: '{{if eq (osBase .ROOT_DIR) "reference"}}../{{end}}scripts/doc_check.py'

tasks:
  generate:
    cmds:
      - wails3 generate bindings -ts -i -names -f '-tags=server' -d frontend/bindings .
      - npm --prefix frontend run routes
  frontend:dev:
    dir: frontend
    cmds: [npm run dev]
  build:dev:
    cmds:
      - task: generate
      - npm --prefix frontend run build:dev
      - node scripts/build.mjs desktop-dev
  run:
    cmds: [node scripts/build.mjs run]
  build:
    cmds:
      - task: generate
      - npm --prefix frontend run build
      - node scripts/build.mjs desktop
  build:server:
    cmds:
      - task: generate
      - npm --prefix frontend run build
      - node scripts/build.mjs server
  build:server:e2e:
    cmds:
      - task: generate
      - npm --prefix frontend run build
      - node scripts/build.mjs server-e2e
  # Screen review with the e2e build (fixed sign-in, file store); not a production path.
  server:review:
    cmds:
      - task: build:server:e2e
      - node scripts/build.mjs run-server-review
  server:review:foundry-change:
    cmds:
      - task: generate
      - npm --prefix frontend run build -- --mode foundry-change-review
      - node scripts/build.mjs server-e2e
      - node scripts/build.mjs run-server-review-foundry-change
  server:
    cmds:
      - task: build:server
      - node scripts/build.mjs run-server
  package:
    cmds:
      - task: build
      - node scripts/build.mjs package
  test:core:
    cmds: [go test ./internal/...]
  verify:
    cmds:
      - task: generate
      - npm --prefix frontend run typecheck
      - npm --prefix frontend run lint
      - npm --prefix frontend run format:check
      - npm --prefix frontend run test
      - go test ./internal/...
      - go vet ./...
      - go vet -tags server ./...
      - go vet -tags server,production,e2e ./...
      - python {{.DOC_CHECK}} .
      - task: build:server:e2e
      - npm --prefix frontend run test:e2e
