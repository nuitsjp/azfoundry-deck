[tools]
go = "1.26.8"
node = "24.20.0"
"go:github.com/wailsapp/wails/v3/cmd/wails3" = "3.0.0-beta.6"

[env]
CGO_ENABLED = "0"

[tasks.setup]
description = "固定した依存を取得する"
run = ["go mod download", "npm --prefix frontend ci"]

[tasks.bindings]
description = "Go サービスから TypeScript を生成する"
run = [
  "node -e \"require('node:fs').mkdirSync('frontend/dist', { recursive: true }); require('node:fs').writeFileSync('frontend/dist/.gitkeep', '')\"",
  "wails3 generate bindings -ts -d frontend/bindings",
]

[tasks.check]
description = "生成コードを含めて Go と TypeScript を検査する"
depends = ["bindings"]
run = ["go vet ./...", "npm --prefix frontend run typecheck"]

[tasks.build]
description = "Windows アプリをビルドする"
depends = ["check"]
run = ["npm --prefix frontend run build", "go build -tags production -trimpath -o bin/azfoundry-deck.exe ."]

[tasks.mock]
description = "F1/F2 モックを固定データで起動する"
depends = ["build"]
env.AZFOUNDRY_MOCK = "1"
run = ".\\bin\\azfoundry-deck.exe"

[tasks.production]
description = "F1/F2を実Azure接続で起動する"
depends = ["build"]
env.AZFOUNDRY_MOCK = "0"
run = ".\\bin\\azfoundry-deck.exe"

[tasks.test]
description = "F1/F2 の取得結果と絞り込み・候補表示を検証する"
depends = ["bindings"]
run = ["go test ./...", "npm --prefix frontend test"]

[tasks."test:azure"]
description = "サインイン済み Azure CLI で F1/F2 の実接続を読み取り検証する"
depends = ["bindings"]
env.AZFOUNDRY_LIVE = "1"
run = "go test ./internal/azurego -run TestLiveAzure -count=1 -v"

[tasks."build:browser"]
description = "共通の画面・GoサービスをWails標準のブラウザー実行用にビルドする"
depends = ["check"]
run = ["npm --prefix frontend run build", "go build -tags server,production -trimpath -o bin/azfoundry-deck-browser.exe ."]

[tasks."mock:browser"]
description = "F1モックをブラウザーで確認する（http://127.0.0.1:9245）"
depends = ["build:browser"]
env.AZFOUNDRY_MOCK = "1"
env.WAILS_SERVER_HOST = "127.0.0.1"
env.WAILS_SERVER_PORT = "9245"
run = ".\\bin\\azfoundry-deck-browser.exe"

[tasks."test:ui"]
description = "F1全シナリオを一時プロファイルのheadless Edgeで検証する"
depends = ["build:browser"]
run = "pwsh -NoProfile -File scripts/Test-F1Browser.ps1"

[tasks."test:add-model:ui"]
description = "モデル追加と配置先の新規作成をheadlessで検証する"
depends = ["build:browser"]
run = "pwsh -NoProfile -File scripts/Test-AddModelBrowser.ps1"

[tasks."test:azure:ui"]
description = "実Azureの成功行と合意済み認証エラーをheadlessで検証する"
depends = ["build:browser"]
run = "pwsh -NoProfile -File scripts/Test-F1Browser.ps1 -Azure"
