# Node.jsは.nvmrcと同じ版を指定する。Go・Pythonは以下の検証用ツール版を使用する。
[tools]
go = "1.26.8"
node = "24.21.0"
python = "3.14.8"

[env]
PYTHONIOENCODING = "utf-8"

[tasks.setup]
description = "固定版ツール、Wails CLI、Go/npm依存と生成コードを準備する"
run = ["mise install", "node scripts/run.mjs setup"]

[tasks."setup:browser"]
description = "E2E用のChromium Headless Shellを導入する"
dir = "frontend"
run = "npx playwright install --only-shell chromium"

[tasks."setup:runner"]
description = "GitHub Actions runnerをWindowsサービスとして登録する（管理者権限が必要。-- 2 などで追加する番号を指定）"
raw = true
run = "pwsh -NoProfile -File scripts/setup-runner.ps1"

[tasks.dev]
description = "Windowsアプリを起動し、Go・Reactの変更を監視する"
run = "node scripts/run.mjs dev"

[tasks.reset]
description = "保存データ・トークンキャッシュ・ログイン記録をすべて削除する（アプリを終了してから実行）"
run = "node scripts/reset.mjs"

[tasks."dev:fresh"]
description = "全データを削除して初期状態に戻してから、Windowsアプリを起動する"
run = ["node scripts/reset.mjs", "node scripts/run.mjs dev"]

[tasks.build]
description = "本番実行ファイルをbin/に生成する"
run = "node scripts/run.mjs build"

[tasks.package]
description = "ビルド後、未署名NSISインストーラーをbin/に生成する"
run = "node scripts/run.mjs package"

[tasks.server]
description = "Go実処理を使うブラウザ確認用サーバーを起動する"
run = "node scripts/run.mjs server"

[tasks."server:review"]
description = "画面確認用：E2E用ビルドを固定の記録でログイン済みから起動する（本番経路ではない）"
run = "node scripts/run.mjs server:review"

[tasks."server:review:login"]
description = "テナント1件のサインイン画面を固定応答で確認する"
run = "node scripts/run.mjs server:review:login"

[tasks."server:review:login-multiple"]
description = "テナント7件のサインインと選択画面を固定応答で確認する"
run = "node scripts/run.mjs server:review:login-multiple"

[tasks."server:review:tenant-change"]
description = "画面確認用：テナント3件でテナント変更を固定応答で確認する（本番経路ではない）"
run = "node scripts/run.mjs server:review:tenant-change"

[tasks."server:review:no-foundry"]
description = "画面確認用：Foundryが1件もない状態の初回閲覧を固定応答で確認する（本番経路ではない）"
run = "node scripts/run.mjs server:review:no-foundry"

[tasks."server:review:foundry-empty"]
description = "画面確認用：保存済みのFoundryがある状態から、一覧の更新でFoundryが0件になることを固定応答で確認する（本番経路ではない）"
run = "node scripts/run.mjs server:review:foundry-empty"

[tasks."server:review:tenant-revisit"]
description = "画面確認用：保存済みの閲覧結果があるテナントへの変更を固定応答で確認する（本番経路ではない）"
run = "node scripts/run.mjs server:review:tenant-revisit"

[tasks."server:review:deployment-detail"]
description = "モデル明細の画面確認用：固定の外部応答で起動する"
run = "node scripts/run.mjs server:review:deployment-detail"

[tasks."server:review:deployment-delete"]
description = "デプロイモデル削除の画面確認用：固定の外部応答で起動する"
run = "node scripts/run.mjs server:review:deployment-delete"

[tasks."server:review:deployment-add"]
description = "デプロイモデル追加の画面確認用：固定の外部応答で起動する"
run = "node scripts/run.mjs server:review:deployment-add"

[tasks."server:review:deployment-update"]
description = "デプロイモデル設定変更の画面確認用：固定の外部応答で起動する"
run = "node scripts/run.mjs server:review:deployment-update"

[tasks.verify]
description = "生成・型検査・Lint・整形・テスト・文書検査・server E2Eを一括実行する"
run = "node scripts/run.mjs verify"

[tasks."test:core"]
description = "Goの機能検証を実行する"
run = "node scripts/run.mjs test:core"
